name: Build and Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_to_npm:
        description: 'Publish to Npm?'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build-native:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64

          - os: ubuntu-26.04-arm
            platform: linux
            arch: arm64

          - os: windows-latest
            platform: win32
            arch: x64

          - os: macos-latest
            platform: darwin
            arch: arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: latest

      - run: pnpm install
      - run: pnpm add -g node-gyp

      - name: Compile (MacOS & Windows)
        if: runner.os == 'macOS' || runner.os == 'Windows'
        shell: bash
        run: |
          node-gyp rebuild --arch=arm64
          mv build/Release/binding.node ${{ matrix.platform }}-arm64.node
          
          node-gyp rebuild --arch=x64
          mv build/Release/binding.node ${{ matrix.platform }}-x64.node

      - name: Compile (Linux)
        if: runner.os == 'Linux'
        run: |
          node-gyp rebuild
          mv build/Release/binding.node ${{ matrix.platform }}-${{ matrix.arch }}.node

      - uses: actions/upload-artifact@v7
        with:
          name: binding-${{ matrix.platform }}-${{ matrix.arch }}
          path: '*.node'
          if-no-files-found: error

  publish:
    needs: build-native
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: latest

      - run: pnpm install

      - run: pnpm run compile:ts

      - uses: actions/download-artifact@v8
        with:
          pattern: binding-*
          merge-multiple: true

      - name: Verify packaged files
        run: npm pack --dry-run

      - name: Publish to npm with Provenance
        if: github.event_name == 'release' || inputs.publish_to_npm == true
        run: npm publish --provenance --access public
